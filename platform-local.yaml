name: leadsignal-platform
services:
  platform:
    build: ./platform-v1
    restart: unless-stopped
    env_file:
      - ./config/platform.env
    environment:
      PORT: "3000"
      APP_ORIGIN: "http://127.0.0.1:18781"
    ports:
      - "127.0.0.1:8781:3000"
    networks:
      - existing_proxy
    labels:
      traefik.enable: "false"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
networks:
  existing_proxy:
    external: true
    name: n8n_default
